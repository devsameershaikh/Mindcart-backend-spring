# =========================================================
# APPLICATION
# =========================================================

spring.application.name=mindcart-backend

# Default profile for local development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# =========================================================
# JPA - COMMON
# =========================================================

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false



# =========================================================
# JACKSON
# =========================================================

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false


# =========================================================
# MULTIPART
# =========================================================

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB


# =========================================================
# MANAGEMENT / ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


# =========================================================
# APPLICATION - JWT
# =========================================================

app.jwt.issuer=mindcart-backend
app.jwt.expiration-days=${JWT_EXPIRATION_DAYS:30}


# =========================================================
# GOOGLE OAUTH
# =========================================================

app.google.client-ids=861993628635-qo7iunh9d357amjagq1eqq1c97gt3s4s.apps.googleusercontent.com


# =========================================================
# CORS
# =========================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}


# =========================================================
# SOCKET.IO
# =========================================================

app.socketio.port=${SOCKETIO_PORT:4001}


# =========================================================
# RATE LIMITING
# =========================================================

app.rate-limit.google-login.capacity=10
app.rate-limit.google-login.refill-per-minute=10

app.rate-limit.invites.capacity=20
app.rate-limit.invites.refill-per-minute=20

# Push Notifications
push.enabled=${PUSH_ENABLED:true}

# Only required when Expo Enhanced Security for Push Notifications is enabled.
# Leave empty otherwise.
push.expo-access-token=${EXPO_ACCESS_TOKEN:}